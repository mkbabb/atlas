# Checks on every pull request, on every push to master and the release line, and on demand.
# Publication is tag-only through release.yml, and a tag is cut only from a commit whose
# `verify` job is green here (RULINGS §J H-A5; release.yml re-checks it).
# Owner order 2026-11-13: no browsers in Actions. The engine specs (`npm run test:engines`) run
# locally through the guard before a release.
name: CI

on:
  push:
    branches:
      - master
      - "release/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "styles/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "CHANGELOG.md"
      - "MIGRATION.md"
      - ".github/workflows/**"
      - "vite.lib.config.mts"
      - "vitest.config.ts"
      - "vitest.browser.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint:pub
      - run: npm run test

name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing over OIDC needs npm >= 11.5.1 (RULINGS §J A-3).
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match $expected"
            exit 1
          fi
      - name: Verify CI is green on the tagged commit
        # §J H-A5: a tag is cut only from a commit whose verify job passed in ci.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json event -q '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful push or workflow_dispatch run of ci.yml on ${GITHUB_SHA}"
            exit 1
          fi
      - name: Publish with provenance
        # The channel follows the version: a prerelease (8.0.0-rc.1) publishes under `next`, because
        # npm refuses a prerelease publish without --tag; `latest` moves only on a final version.
        # Authorization is the repo's NPM_TOKEN secret, as glass-ui publishes; provenance comes from the
        # OIDC id-token (`id-token: write`). When a trusted-publisher entry for mkbabb/atlas +
        # release.yml exists on npmjs.com, delete this env block and npm uses OIDC alone.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          npm publish --provenance --access public --tag "$channel"
